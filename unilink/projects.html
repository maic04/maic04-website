<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UniLink Exchange — Projects</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<header class="main-header">
		<div class="container">
			<h1 class="site-title">UniLink Exchange</h1>
			<nav class="main-nav">
				<ul>
					<li><a href="./index.html#home">Home</a></li>
					<li><a href="./resources.html">Resources</a></li>
					<li><a href="./skills.html">Skill Exchange</a></li>
					<li><a href="./projects.html">Projects</a></li>
					<li><a href="./auth.html">Join/Login</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main>
		<section class="hero-section">
			<div class="container">
				<h2>Project Collaboration Board</h2>
				<p>Share ideas, find collaborators, and get help from other departments.</p>
			</div>
		</section>

		<section class="info-section">
			<div class="container">
				<h3>Open Collaborations</h3>
				<div class="toolbar">
					<input id="q" placeholder="Search title or need">
					<input id="dept" placeholder="Department(s)">
					<button class="btn btn-primary btn-small" id="apply">Apply</button>
				</div>

				<button id="toggle-new" class="btn btn-secondary btn-small">New project</button>
				<form id="new-form" class="inline-form hidden">
					<input id="new-title" placeholder="e.g., Solar IoT water monitoring" required>
					<input id="new-need" placeholder="Needed skills (e.g., firmware, UI)" required>
					<input id="new-dept" placeholder="Departments (e.g., Mech, CS)">
					<button type="submit" class="btn btn-primary btn-small">Post</button>
					<span class="muted">Login required to post</span>
				</form>

				<div class="features-grid" id="projects-list"></div>
			</div>
		</section>
	</main>

	<footer class="main-footer">
		<div class="container">
			<p>&copy; 2025 UniLink Exchange</p>
		</div>
	</footer>

	<script src="./projects.js"></script>
</body>
</html>
