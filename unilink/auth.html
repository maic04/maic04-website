<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UniLink Exchange — Join/Login</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./style.css">
	<style>
	.form-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px; max-width:420px; margin:20px auto; }
	.form-group { margin-bottom:12px; }
	.form-group label { display:block; font-weight:600; margin-bottom:6px; }
	.form-group input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; }
	</style>
</head>
<body>
	<header class="main-header">
		<div class="container">
			<h1 class="site-title">UniLink Exchange</h1>
			<nav class="main-nav">
				<ul>
					<li><a href="./index.html#home">Home</a></li>
					<li><a href="./resources.html">Resources</a></li>
					<li><a href="./skills.html">Skill Exchange</a></li>
					<li><a href="./projects.html">Projects</a></li>
					<li><a href="./auth.html">Join/Login</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main>
		<section class="hero-section">
			<div class="container">
				<h2>Join your university community</h2>
				<p>Use your university email to verify access.</p>
			</div>
		</section>

		<section class="info-section">
			<div class="container">
				<div class="form-card">
					<h3>Create Account</h3>
					<form id="signup-form">
						<div class="form-group">
							<label for="name">Full name</label>
							<input id="name" required>
						</div>
						<div class="form-group">
							<label for="email">University email</label>
							<input id="email" type="email" required placeholder="you@university.edu">
						</div>
						<div class="form-group">
							<label for="password">Password</label>
							<input id="password" type="password" required>
						</div>
						<button class="btn btn-primary" type="submit">Create account</button>
					</form>
				</div>

				<div class="form-card">
					<h3>Login</h3>
					<form id="login-form">
						<div class="form-group">
							<label for="lemail">Email</label>
							<input id="lemail" type="email" required>
						</div>
						<div class="form-group">
							<label for="lpassword">Password</label>
							<input id="lpassword" type="password" required>
						</div>
						<button class="btn btn-secondary" type="submit">Login</button>
					</form>
				</div>
			</div>
		</section>
	</main>

	<footer class="main-footer">
		<div class="container">
			<p>&copy; 2025 UniLink Exchange</p>
		</div>
	</footer>

	<script src="./auth.js"></script>
</body>
</html>
